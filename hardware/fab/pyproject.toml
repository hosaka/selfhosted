[project]
name = "selfhosted-fab"
version = "0.1.0"
description = "Edit, preview, export and render parametric 10-inch rack parts"
requires-python = ">=3.14"
dependencies = [
  "build123d==0.13.0",
  "f3d==4.0.1",
  "glfw==2.11.0",
  "imgui-bundle==1.93.0",
  "pyopengl==3.1.10",
]

[project.scripts]
fab = "fab.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fab"
