name: Renovate

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      log_level:
        description: Renovate log level
        type: choice
        default: info
        options: [info, debug]

jobs:
  renovate:
    name: Renovate
    runs-on: linux-amd64
    container:
      image: docker.io/renovate/renovate:44.172.0@sha256:c0fb80c42b3e45ab1999f2560ca8af5bc394ed4513a33f32591d62678cb3e3e8

    steps:
      - name: Run Renovate
        run: renovate
        env:
          RENOVATE_PLATFORM: forgejo
          RENOVATE_ENDPOINT: ${{ github.server_url }}/api/v1
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_GIT_AUTHOR: Renovate <renovate@hosaka.cc>
          RENOVATE_ONBOARDING: "false"
          GITHUB_COM_TOKEN: ${{ secrets.MISE_TOKEN }}
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
