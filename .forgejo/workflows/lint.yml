name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  lint:
    name: Lint
    runs-on: linux-amd64
    container:
      image: code.forgejo.org/oci/node:24-bookworm@sha256:3d27e5c11e5786e309ec3e03f93ae536eb36e6e5eb3714d5eb3300a36157add0

    steps:
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: https://github.com/jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        env:
          MISE_GITHUB_TOKEN: ${{ secrets.MISE_TOKEN }}

      - name: Run prek checks
        run: |
          prek \
            --from-ref ${{ github.event.pull_request.base.sha || github.event.before }} \
            --to-ref ${{ github.event.pull_request.head.sha || github.event.after }}
