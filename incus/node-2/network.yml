dns:
  domain: hosaka.cc
  hostname: node-2
  nameservers:
    - 10.10.0.1
time:
  timezone: Asia/Tokyo
bonds:
  - name: uplink
    mode: active-backup
    hwaddr: 8c:a6:82:71:9b:96
    members:
      - enp1s0 # 2.5GbE
      - eno1 # 1GbE
    addresses:
      - 10.10.0.102/24
      - slaac
    routes:
      - to: 0.0.0.0/0
        via: 10.10.0.1
    roles:
      - management
      - cluster
      - instances
