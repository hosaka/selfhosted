[project]
name = "selfhosted"
version = "0.1.0"
description = "Selfhosted provisioning, infrastructure and tools"
requires-python = ">=3.14"
dependencies = ["selfhosted-fab", "selfhosted-vps"]

[tool.uv.sources]
selfhosted-fab = { workspace = true }
selfhosted-vps = { workspace = true }

[tool.uv.workspace]
members = ["hardware/fab", "vps"]
